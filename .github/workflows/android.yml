name: Android quality checks
on:
  push:
    branches: [main, 'ccr-**', 'codex/**']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Pure engine (no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.still-kt
          key: still-kt-2.2.21
      - name: Compile engine/ without android.* and run its tests
        run: bash tools/jvm-check.sh
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK and release bundle
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease --console plain
      - name: Failed unit tests, with their messages
        if: failure()
        run: find app/build/test-results -name '*.xml' -exec grep -h -B1 -A6 '<failure' {} \; 2>/dev/null | head -120
      - name: Verify merged privacy manifests (debug and release)
        run: python3 tools/verify_manifest.py
      - name: Record runtime dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console plain > app/build/reports/runtime-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: still-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/device_checks.sh
      - name: Keep the screenshots in docs/screenshots when the commit asks ([screens])
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[screens]')
        run: |
          mkdir -p docs/screenshots docs/motion
          find device-screenshots -name '*.png' -exec cp {} docs/screenshots/ \;
          find device-screenshots/motion -name '*.mp4' -exec cp {} docs/motion/ \; 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/motion
          git diff --cached --quiet && exit 0
          git commit -m "Screenshots from emulator run ${{ github.run_id }} [skip ci]"
          # GitHub sometimes drops the push mid-way (a 408); a few tries with a fresh rebase each time.
          for try in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((try * 15))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: still-device-reports
          path: |
            app/build/reports/androidTests/
            device-screenshots/
  release:
    # A push whose message carries "[release vX.Y.Z]" publishes a signed, optimised release
    # candidate at that commit once the three checks above have passed: the tag is made with it.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release v')
    needs: [engine, build, device]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      STILL_RC_SIGNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Read the tag from the commit message
        run: |
          TAG=$(printf '%s' "$HEAD_MESSAGE" | grep -o '\[release v[^]]*\]' | head -1 | sed 's/\[release //; s/\]//')
          [ -n "$TAG" ] || { echo "no [release vX] marker"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "releasing $TAG at $GITHUB_SHA"
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
      - name: Signed release APK and bundle
        run: ./gradlew assembleRelease bundleRelease --console plain
      - name: Name the files for the tag and sum them
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/still-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/still-${TAG}.aab"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Still $TAG" --notes-file release/NOTES.md --prerelease
