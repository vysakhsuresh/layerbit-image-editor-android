name: Android quality checks
on:
  push:
    branches: [main, 'ccr-**', 'codex/**']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Pure engine (no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.studio-kt
          key: studio-kt-2.2.21
      - name: Compile engine/ without android.* and run its tests
        run: bash tools/jvm-check.sh
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK and release bundle
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease --console plain
      - name: Verify merged privacy manifests (debug and release)
        run: python3 tools/verify_manifest.py
      - name: Record runtime dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console plain > app/build/reports/runtime-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/device_checks.sh
      - name: Keep the screenshots in docs/screenshots when the commit asks ([screens])
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[screens]')
        run: |
          mkdir -p docs/screenshots
          find device-screenshots -name '*.png' -exec cp {} docs/screenshots/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Screenshots from emulator run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-device-reports
          path: |
            app/build/reports/androidTests/
            device-screenshots/
