name: Android quality checks
on:
  push:
    branches: [main, codex/offline-editor]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console plain
      - name: Verify merged privacy manifest
        run: python3 scripts/verify_manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            status=0
            ./gradlew connectedDebugAndroidTest --console plain || status=$?
            adb pull /sdcard/Android/data/com.layerbit.studio/files/screenshots device-screenshots || true
            exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-device-reports
          path: |
            app/build/reports/androidTests/
            device-screenshots/
