name: Release candidate
# A tag v* builds an optimised, signed release candidate after every check the branch runs:
# the pure engine, the unit tests and lint, and the emulator walk. Only when all three pass is
# the APK published, with the bundle and checksums, as a GitHub Release for the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to create and release, e.g. v1.0.0-rc.1 (made at the dispatched commit)'
        required: true
permissions:
  contents: read
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  engine:
    name: Pure engine (no Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash tools/jvm-check.sh
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STILL_RC_SIGNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, signed release APK and bundle
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --console plain
      - name: Verify merged privacy manifests
        run: python3 tools/verify_manifest.py
      - name: Name the files for the tag and sum them
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/still-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/still-${TAG}.aab"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console plain
  publish:
    needs: [engine, build, device]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # From a tag push the tag exists; from a dispatch, the release is made at this commit and the tag with it.
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Still $TAG" --notes-file release/NOTES.md --prerelease
